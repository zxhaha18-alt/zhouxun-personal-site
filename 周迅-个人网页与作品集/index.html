<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: #000; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* 花园：固定背景层 */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  /* 遮罩：随滚动加深，保证正文可读 */
  #veil {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 50% 0%, rgba(0,0,0,.35) 0%, rgba(0,0,0,.82) 55%, #000 100%);
    transition: opacity 240ms linear;
  }
  main { position: relative; z-index: 10; }
  section { scroll-margin-top: 96px; }

  /* Hero gestures belong to the WebGL canvas, not native text selection. */
  #hero { user-select: none; -webkit-user-select: none; pointer-events: none; }
  #hero h1, #hero p, #hero span { user-select: none; -webkit-user-select: none; }
  #hero img, #hero canvas { -webkit-user-drag: none; user-drag: none; }
  #hero a, #hero button { pointer-events: auto; }
  #c { touch-action: none; }
  #daylight { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 1; background: linear-gradient(180deg, rgba(248,246,240,.94) 0%, rgba(248,246,240,.88) 48%, rgba(248,246,240,.74) 100%); transition: opacity .8s ease; }
  /* The previous full-screen liquid mask forced costly repaints and flashed on some GPUs. */
  #morphTrail { display: none; }

  /* 首屏之外的内容板：压住花园但保留一点通透 */
  .panel {
    background: rgba(6, 6, 8, .72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid rgba(242, 237, 227, .08);
  }

  /* 入场动画。只在 js 就绪后才隐藏，避免脚本异常时整页正文不可见 */
  .reveal { opacity: 1; }
  html.js .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease-out, transform .7s ease-out; }
  html.js .reveal.in { opacity: 1; transform: none; }

  /* 待填写占位框 */
  .todo {
    display: block; border: 1px dashed rgba(242,237,227,.28); border-radius: 10px;
    padding: 14px 16px; color: rgba(242,237,227,.42); font-size: 13px; line-height: 1.7;
  }
  .todo b { display: block; font-weight: 500; color: rgba(242,237,227,.6); margin-bottom: 4px; }
  .todo code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    color: rgba(242,237,227,.5); background: rgba(242,237,227,.06);
    padding: 1px 5px; border-radius: 4px;
  }

  .card {
    background: rgba(242, 237, 227, .035);
    border: 1px solid rgba(242, 237, 227, .1);
    border-radius: 16px;
  }
  .tag {
    border: 1px solid rgba(242,237,227,.16); border-radius: 999px;
    padding: 4px 11px; font-size: 12px; color: rgba(242,237,227,.72);
  }
  .project-card:nth-child(1) .project-index, .project-card:nth-child(1) .project-result strong { color: #9eb8ff; }
  .project-card:nth-child(2) .project-index, .project-card:nth-child(2) .project-result strong { color: #c8a8ff; }
  .project-card:nth-child(3) .project-index, .project-card:nth-child(3) .project-result strong { color: #f1a080; }
  .project-card:nth-child(1) { border-top: 2px solid #4669d6; }
  .project-card:nth-child(2) { border-top: 2px solid #8554c9; }
  .project-card:nth-child(3) { border-top: 2px solid #c86648; }

  /* Practice is a scan-first timeline; details stay collapsed until requested. */
  .practice-list { border-top: 1px solid rgba(242,237,227,.18); }
  .practice-company { padding: 30px 0 34px; border-bottom: 1px solid rgba(242,237,227,.12); }
  .practice-company-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; }
  .practice-company-id { display: flex; align-items: flex-start; gap: 21px; }
  .practice-bloom { position: relative; flex: 0 0 19px; width: 19px; height: 19px; margin-top: 4px; color: #ee7951; opacity: .34; transform: scale(.62); transition: transform .35s ease, opacity .35s ease, filter .35s ease; }
  .practice-bloom::before { content: ''; position: absolute; left: 8px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 -7px 0 -1px currentColor, 5px -5px 0 -1px currentColor, 7px 0 0 -1px currentColor, 5px 5px 0 -1px currentColor, 0 7px 0 -1px currentColor, -5px 5px 0 -1px currentColor, -7px 0 0 -1px currentColor, -5px -5px 0 -1px currentColor; }
  .practice-bloom b { position: absolute; left: 7px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #f2ede3; }
  .practice-company.is-active .practice-bloom { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 6px currentColor); }
  .practice-company-no { color: #ee7951; font: 500 11px ui-monospace,SFMono-Regular,Menlo,monospace; padding-top: 4px; }
  .practice-company h3 { margin: 0; font: 400 clamp(25px,3vw,40px)/1.05 'STIX Two Text',Songti SC,serif; color: rgba(242,237,227,.96); }
  .practice-company-id p { margin: 8px 0 4px; color: rgba(242,237,227,.55); font-size: 13px; }
  .practice-period { color: rgba(242,237,227,.32); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .08em; }

  .practice-signal span { display: block; margin-top: 6px; color: rgba(242,237,227,.42); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .practice-cases { margin: 26px 0 0 42px; border-left: 1px solid rgba(242,237,227,.13); }
  .practice-case { border-bottom: 1px solid rgba(242,237,227,.09); }
  .practice-case:last-child { border-bottom: 0; }
  .practice-case summary { display: grid; grid-template-columns: 34px 1fr 30px; align-items: center; gap: 12px; padding: 17px 0 17px 18px; cursor: pointer; list-style: none; }
  .practice-case summary::-webkit-details-marker { display: none; }
  .practice-case-no { color: rgba(242,237,227,.3); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; }

  .practice-case-toggle { justify-self: end; width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid rgba(242,237,227,.2); border-radius: 50%; color: #f08b61; font-size: 16px; line-height: 1; transition: transform .2s, background .2s; }
  .practice-case[open] .practice-case-toggle { transform: rotate(45deg); background: rgba(242,237,227,.08); }
  .practice-case-body { padding: 0 30px 21px 64px; }
  .practice-step { display: grid; grid-template-columns: 47px 1fr; gap: 16px; margin-top: 11px; }
  .practice-step span { padding-top: 3px; color: rgba(242,237,227,.32); font: 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .08em; }
  .practice-step p { margin: 0; color: rgba(242,237,227,.62); font-size: 13px; line-height: 1.8; }
  .practice-tone-1 .practice-company-no, .practice-tone-1 .practice-signal strong { color: #a8b7ff; }
  .practice-tone-2 .practice-company-no, .practice-tone-2 .practice-signal strong { color: #e98fc0; }
  .practice-tone-3 .practice-company-no, .practice-tone-3 .practice-signal strong { color: #e4c37a; }

  .ui { position: fixed; z-index: 20; color: rgba(255,255,255,.72); user-select: none; pointer-events: none; }
  #hint { bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .55; transition: opacity 1.2s ease; white-space: nowrap; }
  #hint.hide { opacity: 0; }
  #load { top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .5; }

  .overlay { visibility: hidden; transition: visibility 500ms ease-out; }
  .overlay.is-open { visibility: visible; }
  .overlay-backdrop { opacity: 0; transition: opacity 500ms ease-out; }
  .overlay.is-open .overlay-backdrop { opacity: 1; }
  .overlay-x {
    opacity: 0; transform: rotate(90deg) scale(.75);
    transition: opacity 500ms ease-out, transform 500ms ease-out;
  }
  .overlay.is-open .overlay-x { opacity: 1; transform: rotate(0deg) scale(1); transition-delay: 100ms; }
  .overlay-link {
    opacity: 0; transform: translateY(1.5rem);
    transition: opacity 500ms ease-out, transform 500ms ease-out;
  }
  .overlay.is-open .overlay-link { opacity: 1; transform: translateY(0); transition-delay: var(--d, 0ms); }
  .icon-swap { transition: opacity 300ms ease-out, transform 300ms ease-out; }

  /* Hero text is a quiet readable island above the animated garden. */
  #hero { position: relative; min-height: 100vh; padding-top: 84px; }
  .hero-copy-card {
    position: relative; z-index: 12; width: min(920px, calc(100vw - 64px)); min-height: 470px;
    display: grid; place-items: center; overflow: hidden; padding: 62px 76px 56px;

    animation: bubble-breathe 9s ease-in-out infinite alternate;

  @keyframes bubble-breathe {

    50% { border-radius: 36% 31% 39% 30% / 31% 27% 30% 36%; transform: translate3d(0,-3px,0) scale(1.004); }
    100% { border-radius: 33% 40% 29% 38% / 28% 35% 27% 33%; transform: translate3d(0,2px,0) scale(.998); }
  }
  .hero-bubble-liquid { position: absolute; inset: -14%; background: radial-gradient(circle at 24% 24%, rgba(255,255,255,.22), transparent 28%), radial-gradient(circle at 78% 72%, rgba(127,103,255,.22), transparent 32%), linear-gradient(125deg, rgba(238,113,73,.18), rgba(71,104,211,.14) 52%, rgba(255,255,255,.12)); opacity: .85; transform: scale(1.08); }
  @keyframes liquid-drift { from { transform: translate3d(-1.5%,-1%,0) scale(1.08) rotate(-1deg); } to { transform: translate3d(1.5%,1%,0) scale(1.12) rotate(1deg); } }
  .hero-bubble-frost { position: absolute; inset: 0; border-radius: inherit; background: rgba(8,8,10,.48); box-shadow: inset 0 2px 3px rgba(255,255,255,.18), inset 0 -2px 4px rgba(0,0,0,.18); }
  .hero-bubble-content { position: relative; z-index: 2; width: 100%; text-align: center; }
  .hero-identity { margin: 0; color: #f2ede3; font: 400 clamp(37px,5vw,58px)/1.05 'STIX Two Text',Songti SC,serif; letter-spacing: 0; }
  .hero-identity span { font-size: .56em; color: rgba(242,237,227,.7); white-space: nowrap; }
  .hero-background { margin: 16px 0 0; color: rgba(242,237,227,.66); font-size: 13px; letter-spacing: .025em; }
  .hero-background strong { color: rgba(242,237,227,.94); font-weight: 500; }

  .hero-metrics { margin: 9px auto 0; color: #f1a07b; font: 500 12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .hero-thesis { margin: 25px auto 0; color: rgba(242,237,227,.92); font: 400 clamp(16px,1.7vw,20px)/1.55 'STIX Two Text',Songti SC,serif; }
  .hero-thesis span { color: rgba(242,237,227,.66); }
  .hero-module-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 29px auto 0; }
  .hero-module-button { display: inline-flex; align-items: center; gap: 12px; border: 1px solid rgba(242,237,227,.23); border-radius: 999px; padding: 10px 14px; color: rgba(242,237,227,.77); font-size: 12px; transition: background .2s, color .2s, transform .2s; }

  .hero-module-primary { color: #0a0a0a; background: #F2EDE3; border-color: #F2EDE3; }
  .hero-layout { position: relative; z-index: 12; display: grid; grid-template-columns: minmax(0,1fr) 340px; align-items: center; gap: clamp(42px,7vw,92px); width: min(1120px,calc(100vw - 64px)); }
  .hero-main { position: relative; isolation: isolate; max-width: 670px; }
  .hero-main::before { content: ''; position: absolute; z-index: -1; inset: -80px -105px; pointer-events: none; background: radial-gradient(ellipse at 42% 52%, rgba(5,5,8,.76) 0%, rgba(5,5,8,.54) 42%, rgba(5,5,8,.18) 68%, transparent 78%); }
  .hero-eyebrow { margin: 0 0 18px; color: rgba(242,237,227,.52); font: 500 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .2em; }
  .hero-main .hero-identity { font-size: clamp(48px,6vw,72px); }
  .hero-main .hero-background { margin-top: 18px; font-size: 14px; }
  .hero-main .hero-thesis { margin-top: 34px; font-size: clamp(22px,2.5vw,32px); line-height: 1.36; }

  .hero-main .hero-module-actions { justify-content: flex-start; margin-top: 34px; }
  body.theme-dark .hero-main { text-shadow: 0 2px 22px rgba(0,0,0,.72); }
  body.theme-dark .hero-main::before { background: radial-gradient(ellipse at 42% 52%, rgba(4,4,7,.9) 0%, rgba(4,4,7,.66) 44%, rgba(4,4,7,.26) 68%, transparent 80%); }
  .hero-facts-card { position: relative; width: 340px; height: 460px; overflow: hidden; padding: 32px; border: 1px solid rgba(242,237,227,.18); border-radius: 48px; background: transparent; box-shadow: 0 28px 80px rgba(0,0,0,.24), inset 0 1.5px 2px rgba(255,255,255,.24), inset 0 -1px 2px rgba(0,0,0,.16); backdrop-filter: blur(17px) saturate(1.2); -webkit-backdrop-filter: blur(17px) saturate(1.2); }

  .hero-facts-content { position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%; }
  .hero-facts-label { color: #ee906a; font: 500 9px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .18em; }

  .hero-result-list span { color: rgba(242,237,227,.42); font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .hero-single { position: relative; isolation: isolate; z-index: 12; width: min(940px,calc(100vw - 56px)); text-align: center; }
  .hero-single::before { content: ''; position: absolute; z-index: -1; inset: -90px -130px; pointer-events: none; background: radial-gradient(ellipse at 50% 48%, rgba(5,5,8,.88) 0%, rgba(5,5,8,.58) 42%, rgba(5,5,8,.18) 67%, transparent 78%); }

  .hero-name-trigger { position: relative; display: inline-flex; align-items: baseline; border: 0; padding: 0; background: none; color: inherit; font: inherit; line-height: inherit; letter-spacing: inherit; cursor: pointer; pointer-events: auto; }

  .hero-name-trigger.is-blooming .hero-name-bud { transform: rotate(70deg) scale(1.15); background: #f2ede3; box-shadow: 0 0 16px #ef8a63; }
  .hero-name-bloom-stage { position: absolute; z-index: 4; left: 50%; top: 76px; width: min(620px,90vw); height: 120px; transform: translateX(-50%); pointer-events: none; }
  .name-flower { --flower-color: #ef7a56; position: absolute; left: calc(50% + var(--flower-x)); top: calc(50% + var(--flower-y)); width: 13px; height: 13px; opacity: 0; transform: translate(-50%,-50%) scale(.08) rotate(-25deg); animation: name-flower-open 1.5s var(--flower-delay) cubic-bezier(.16,1,.3,1) forwards; filter: drop-shadow(0 0 8px var(--flower-color)); }
  .name-flower b { position: absolute; left: 50%; top: 50%; width: 9px; height: 17px; border-radius: 75% 25% 72% 28%; background: var(--flower-color); transform-origin: 50% 100%; transform: translate(-50%,-100%) rotate(var(--petal-angle)) scaleY(.12); animation: name-petal-open .7s calc(var(--flower-delay) + 90ms) cubic-bezier(.16,1,.3,1) forwards; }

  @keyframes name-flower-open { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.08) rotate(-25deg); } 28% { opacity: 1; } 68% { opacity: 1; transform: translate(-50%,-50%) scale(var(--flower-scale)) rotate(0deg); } 100% { opacity: 0; transform: translate(-50%,-58%) scale(calc(var(--flower-scale) * 1.08)) rotate(9deg); } }

  /* A quiet closing scene: the computer keeps working, and flowers drift out. */
  .footer-easter-egg { position: relative; display: grid; place-items: center; min-height: 150px; overflow: hidden; }
  .footer-computer { position: relative; z-index: 2; width: 84px; }
  .footer-screen { position: relative; width: 84px; height: 55px; padding: 6px; border: 2px solid rgba(242,237,227,.45); border-radius: 6px; background: rgba(6,6,8,.7); box-shadow: 0 10px 30px rgba(0,0,0,.22), 0 0 20px rgba(196,81,56,.08); animation: computer-breathe 3.8s ease-in-out infinite, computer-glow 4.4s ease-in-out infinite; }
  .footer-screen span { display: block; width: 100%; height: 100%; border-radius: 2px; background: repeating-linear-gradient(180deg, rgba(196,81,56,.34) 0 2px, transparent 2px 6px); opacity: .72; animation: screen-flicker 4.2s ease-in-out infinite; }
  .footer-screen i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--brand-accent); opacity: .7; }
  .footer-screen i:nth-of-type(1) { left: 10px; bottom: 10px; }
  .footer-screen i:nth-of-type(2) { left: 20px; bottom: 18px; }
  .footer-screen i:nth-of-type(3) { left: 30px; bottom: 13px; }
  .footer-base { width: 100px; height: 7px; margin-left: -8px; border-radius: 0 0 7px 7px; background: rgba(242,237,227,.34); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
  .footer-flowers { position: absolute; left: 50%; top: 50%; width: min(520px,90vw); height: 130px; transform: translate(-50%,-50%); pointer-events: none; }
  .footer-flowers i { --flower-size: 13px; position: absolute; left: 50%; top: 56%; width: var(--flower-size); height: var(--flower-size); border-radius: 50%; background: #f6c785; color: #dc7258; opacity: 0; filter: drop-shadow(0 0 8px rgba(196,81,56,.75)); animation: flower-drift 5.8s var(--delay) ease-out infinite; }
  .footer-flowers i::before { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; transform: translate(-50%,-50%); border-radius: 50%; background: currentColor; box-shadow: 0 -10px 0 -1px currentColor, 8px -6px 0 -1px currentColor, 10px 3px 0 -1px currentColor, 5px 9px 0 -1px currentColor, -5px 9px 0 -1px currentColor, -10px 3px 0 -1px currentColor, -8px -6px 0 -1px currentColor; }
  .footer-flowers i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; transform: translate(-50%,-50%); border-radius: 50%; background: #fff2b0; box-shadow: 0 0 7px #fff2b0; }
  .footer-flowers i:nth-child(1) { --delay: 0s; --x: -170px; --y: -42px; --scale: .8; }
  .footer-flowers i:nth-child(2) { --delay: 1.4s; --x: -76px; --y: -58px; --scale: 1.05; }
  .footer-flowers i:nth-child(3) { --delay: 2.7s; --x: 79px; --y: -51px; --scale: .74; }
  .footer-flowers i:nth-child(4) { --delay: 3.9s; --x: 165px; --y: -35px; --scale: .92; }
  @keyframes computer-breathe { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-2px); } }
  @keyframes computer-glow { 0%,100% { filter: brightness(.92); } 45% { filter: brightness(1.18); } 55% { filter: brightness(1.02); } }
  @keyframes flower-drift { 0% { opacity: 0; transform: translate(-50%,0) scale(.2) rotate(-15deg); } 14% { opacity: .85; } 72% { opacity: .66; transform: translate(calc(-50% + var(--x)), var(--y)) scale(var(--scale)) rotate(18deg); } 100% { opacity: 0; transform: translate(calc(-50% + var(--x) * 1.18), calc(var(--y) - 8px)) scale(calc(var(--scale) * .72)) rotate(36deg); } }

  /* Content chapters alternate between two restrained surfaces. */
  .panel {
    --section-a: rgba(6,6,8,.94);
    --section-b: rgba(12,12,14,.96);
    overflow: clip;
    background: var(--section-a);
  }
  .panel > section,
  .panel > footer { position: relative; isolation: isolate; }
  .panel > section::before,
  .panel > footer::before {
    content: '';
    position: absolute;
    z-index: -1;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    background: var(--section-a);
    transition: background-color .7s ease;
  }
  .panel > section:nth-of-type(even)::before,
  .panel > footer::before { background: var(--section-b); }
  .panel > section:nth-of-type(even) { border-top: 1px solid rgba(242,237,227,.055); }
  .panel > section:nth-of-type(even) .card { background: rgba(242,237,227,.05); border-color: rgba(242,237,227,.12); }

  body.theme-light .panel {
    --section-a: #f7f5ef;
    --section-b: #f0ede6;
    background: var(--section-a);
  }
  body.theme-light .panel > section:nth-of-type(even) { border-top-color: rgba(23,23,23,.07); }
  body.theme-light .panel > section:nth-of-type(even) .card { background: rgba(255,255,255,.42); border-color: rgba(23,23,23,.11); }
